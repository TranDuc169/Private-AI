name: private-ai-release
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: private_ai
      POSTGRES_USER: private_ai
      POSTGRES_PASSWORD: ${RELEASE_DB_PASSWORD:?Set RELEASE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${RELEASE_DB_PORT:-55432}:5432"
    volumes:
      - release_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U private_ai -d private_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://private_ai:${RELEASE_DB_PASSWORD:?Set RELEASE_DB_PASSWORD}@db:5432/private_ai
      JWT_SECRET: ${RELEASE_JWT_SECRET:?Set RELEASE_JWT_SECRET}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ORIGINS: '${RELEASE_CORS_ORIGINS:-["http://127.0.0.1:5174","http://localhost:5174"]}'
      STORAGE_DIR: /app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${RELEASE_API_PORT:-8002}:8000"
    volumes:
      - release_documents:/app/storage
    depends_on:
      db:
        condition: service_healthy
volumes:
  release_database:
  release_documents:
